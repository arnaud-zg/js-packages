# .github/actions/ship/action.yml
#
# Ships a release with shiplane, in one step of your own job, after its checkout. The job names the
# GitHub Environment and the permissions; `shiplane setup` writes the workflow:
#
#   - uses: arnaud-zg/js-packages/.github/actions/ship@<sha> # shiplane@x.y.z
#     with: { units: "${{ inputs.units }}", environment: "${{ inputs.environment }}" }
#
# It sets the project up like setup-node-project, then runs `shiplane doctor --ci` (fails before
# anything ships when something is not supported) and the command the environment calls for. Only
# those two steps see the secrets passed to it.
# What is supported, and every error it can give:
# https://github.com/arnaud-zg/js-packages/blob/main/docs/shiplane/reference.md#github-actions-workflow

name: Ship with shiplane
description: "Sets the project up, checks what ships, then ships it: apps to an environment, npm packages to a channel."

inputs:
  environment:
    description: "An environment apps deploy to, a test release channel such as nightly, or latest: the released npm packages"
    required: true
  units:
    description: "Units to ship, space separated (empty: every unit the environment lacks)"
    default: ""
  dry-run:
    description: "Show what would ship, ship nothing"
    default: "false"
  node-version:
    description: "Last resort: a Node version, when the repo has no .nvmrc, .node-version or engines.node"
    default: ""
  install-command:
    description: "Last resort: the install command, when the detected one does not fit"
    default: ""
  working-directory:
    description: "Last resort: the folder holding shiplane.config.ts or shiplane.yml, when it is not the repo root"
    default: "."
  github-token:
    description: "The token shiplane acts with; a GitHub App's, to start other workflows"
    default: ${{ github.token }}
  FLY_API_TOKEN:
    description: "Fly: flyServerHosting deploys with it"
    default: ""
  CLOUDFLARE_API_TOKEN:
    description: "Cloudflare Pages: cloudflarePagesStaticHosting deploys with it"
    default: ""
  CLOUDFLARE_ACCOUNT_ID:
    description: "Cloudflare Pages: the account cloudflarePagesStaticHosting deploys to"
    default: ""
  EXPO_TOKEN:
    description: "EAS: easMobileDistribution builds and updates with it"
    default: ""

runs:
  using: composite
  steps:
    # Changesets compares with the local default branch, which a run on another ref does not have.
    - name: Have the default branch here
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        git show-ref --verify --quiet "refs/heads/$DEFAULT_BRANCH" ||
          git branch --quiet "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"

    # Only here: the setup-node-project action serves any Node project.
    - name: Find the shiplane config
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        for file in shiplane.config.ts shiplane.config.mts shiplane.config.js shiplane.config.mjs shiplane.yml shiplane.yaml; do
          [ -f "$file" ] && exit 0
        done
        echo "::error::no shiplane.config.ts or shiplane.yml in $WORKING_DIRECTORY (https://github.com/arnaud-zg/js-packages/blob/main/docs/shiplane/reference.md#github-actions-workflow)"
        exit 1

    # The same steps as .github/actions/setup-node-project, which other repos import; a test keeps them equal.
    - name: Detect the package manager and Node version
      id: detect
      env:
        NODE_VERSION_INPUT: ${{ inputs.node-version }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      shell: node {0}
      working-directory: ${{ inputs.working-directory }}
      run: |
        const fs = require("node:fs");
        const path = require("node:path");
        const docs =
          "https://github.com/arnaud-zg/js-packages/blob/main/docs/shiplane/reference.md#github-actions-workflow";
        const fail = (message) => {
          console.log(`::error::${message} (${docs})`);
          process.exit(1);
        };
        const here = process.cwd();
        const root = process.env.GITHUB_WORKSPACE ?? here;
        const read = (file) => {
          for (const dir of [here, root]) {
            const full = path.join(dir, file);
            if (fs.existsSync(full)) return fs.readFileSync(full, "utf8");
          }
          return null;
        };
        const manifest = JSON.parse(read("package.json") ?? "{}");
        const lockfiles = {
          "pnpm-lock.yaml": "pnpm",
          "package-lock.json": "npm",
          "yarn.lock": "yarn",
          "bun.lock": "bun",
          "bun.lockb": "bun",
        };
        const fromLock = Object.entries(lockfiles).find(([file]) => read(file) !== null)?.[1];
        const pm = manifest.packageManager?.split("@")[0] ?? fromLock;
        if (!pm) fail("no package manager: add packageManager to package.json, or a lockfile");
        if (!["pnpm", "npm", "yarn"].includes(pm)) {
          fail(`unsupported package manager "${pm}": pnpm, npm or yarn`);
        }
        const input = process.env.NODE_VERSION_INPUT;
        const file = [".nvmrc", ".node-version"].find((name) => read(name) !== null);
        const engines = manifest.engines?.node;
        if (!input && !file && !engines) fail("no Node version: add .nvmrc or set node-version");
        const execs = { pnpm: "pnpm exec", npm: "npx --no-install", yarn: "yarn" };
        const out = [
          `pm=${pm}`,
          `has-manifest-pm=${Boolean(manifest.packageManager)}`,
          `node-version=${input || (file ? "" : engines)}`,
          `node-version-file=${input || !file ? "" : path.relative(root, path.join(fs.existsSync(path.join(here, file)) ? here : root, file))}`,
          `exec=${execs[pm]}`,
        ];
        fs.appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
        console.log(out.join("\n"));

    # Before Node, so setup-node finds pnpm to cache its store. It reads packageManager and
    # installs any pnpm version, which the corepack a Node release ships with may be too old for.
    - name: Set up pnpm
      if: ${{ steps.detect.outputs.pm == 'pnpm' }}
      uses: pnpm/action-setup@v4
      with:
        version: ${{ steps.detect.outputs.has-manifest-pm != 'true' && 'latest' || '' }}

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: ${{ steps.detect.outputs.node-version }}
        node-version-file: ${{ steps.detect.outputs.node-version-file }}
        # pnpm and npm cache their store here; yarn installs without a cache.
        cache: ${{ steps.detect.outputs.pm != 'yarn' && steps.detect.outputs.pm || '' }}
        # Never guessed from packageManager: the line above says which cache.
        package-manager-cache: false

    - name: Set up yarn
      if: ${{ steps.detect.outputs.pm == 'yarn' }}
      env:
        HAS_MANIFEST_PM: ${{ steps.detect.outputs.has-manifest-pm }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # corepack reads packageManager; the one a Node release ships with may be too old.
        if [ "$HAS_MANIFEST_PM" = "true" ]; then
          npm install --global corepack@latest
          corepack enable
        else npm install --global yarn; fi
        yarn --version

    # The installed tree, keyed on the exact lockfile and Node: a hit skips the install.
    - name: Node version
      id: node
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"

    # Restores now; its post step saves node_modules at the end of the job, after a miss and
    # only when the job succeeded, so a failed install is never cached.
    - name: Cache node_modules
      id: modules
      if: ${{ inputs.install-command == '' }}
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          */node_modules
          */*/node_modules
        key: shiplane-modules-${{ runner.os }}-${{ steps.node.outputs.version }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json', '**/yarn.lock') }}

    - name: Install
      id: install
      if: ${{ steps.modules.outputs.cache-hit != 'true' }}
      env:
        PM: ${{ steps.detect.outputs.pm }}
        INSTALL_COMMAND: ${{ inputs.install-command }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -n "$INSTALL_COMMAND" ]; then
          eval "$INSTALL_COMMAND"
          exit
        fi
        case "$PM" in
          pnpm) pnpm install --frozen-lockfile ;;
          npm) npm ci ;;
          yarn)
            if [ "$(yarn --version | cut -d. -f1)" -ge 2 ]; then yarn install --immutable
            else yarn install --frozen-lockfile; fi ;;
        esac

    # Node 22 ships npm 10: OIDC publishes from 11.5.1 and moves dist-tags from 11.21.
    - name: Update npm
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Only a job that allows id-token: write signs in with OIDC.
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then npm install --global npm@^11.21.0; fi

    # Fails here, before anything ships, when something is not supported; installs missing tools.
    - name: Check what ships
      # The only steps that see the secrets: each one an adapter reads, by name.
      env:
        EXEC: ${{ steps.detect.outputs.exec }}
        UNITS: ${{ inputs.units }}
        ENVIRONMENT: ${{ inputs.environment }}
        DRY_RUN: ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}
        # gh and every adapter calling it read GH_TOKEN.
        GH_TOKEN: ${{ inputs.github-token }}
        FLY_API_TOKEN: ${{ inputs.FLY_API_TOKEN }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.CLOUDFLARE_ACCOUNT_ID }}
        EXPO_TOKEN: ${{ inputs.EXPO_TOKEN }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # shellcheck disable=SC2086 # one word per unit, and the exec prefix's words
        $EXEC shiplane doctor --ci $UNITS --channel "$ENVIRONMENT"

    - name: Ship
      env:
        EXEC: ${{ steps.detect.outputs.exec }}
        UNITS: ${{ inputs.units }}
        ENVIRONMENT: ${{ inputs.environment }}
        DRY_RUN: ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}
        # gh and every adapter calling it read GH_TOKEN.
        GH_TOKEN: ${{ inputs.github-token }}
        FLY_API_TOKEN: ${{ inputs.FLY_API_TOKEN }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.CLOUDFLARE_ACCOUNT_ID }}
        EXPO_TOKEN: ${{ inputs.EXPO_TOKEN }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # A release's tags are annotated, which needs an identity.
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # shellcheck disable=SC2086 # one word per unit, and the exec prefix's words
        $EXEC shiplane ship $UNITS --channel "$ENVIRONMENT" --yes --no-mascot $DRY_RUN
